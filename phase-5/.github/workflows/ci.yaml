name: CI - Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  PUBLISHER_IMAGE: publisher-service
  SUBSCRIBER_IMAGE: subscriber-service

jobs:
  # T056: Unit tests with pytest
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install publisher dependencies
        run: pip install -r src/services/publisher/requirements.txt

      - name: Install subscriber dependencies
        run: pip install -r src/services/subscriber/requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run publisher tests
        run: |
          cd src
          python -m pytest ../tests/unit/test_publisher.py -v --tb=short

      - name: Run subscriber tests
        run: |
          cd src
          python -m pytest ../tests/unit/test_subscriber.py -v --tb=short

  # T057: Docker build for both services
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service:
          - name: publisher
            dockerfile: src/services/publisher/Dockerfile
          - name: subscriber
            dockerfile: src/services/subscriber/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v5
        with:
          context: src
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ${{ matrix.service.name }}-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # T058: Push images to container registry
  push-acr:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: azure
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push publisher
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/services/publisher/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.PUBLISHER_IMAGE }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.PUBLISHER_IMAGE }}:latest

      - name: Build and push subscriber
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/services/subscriber/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SUBSCRIBER_IMAGE }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.SUBSCRIBER_IMAGE }}:latest

  push-gar:
    name: Push to Google Artifact Registry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: gcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build and push publisher
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/services/publisher/Dockerfile
          push: true
          tags: |
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dapr-demo/${{ env.PUBLISHER_IMAGE }}:${{ github.sha }}
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dapr-demo/${{ env.PUBLISHER_IMAGE }}:latest

      - name: Build and push subscriber
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/services/subscriber/Dockerfile
          push: true
          tags: |
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dapr-demo/${{ env.SUBSCRIBER_IMAGE }}:${{ github.sha }}
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dapr-demo/${{ env.SUBSCRIBER_IMAGE }}:latest
