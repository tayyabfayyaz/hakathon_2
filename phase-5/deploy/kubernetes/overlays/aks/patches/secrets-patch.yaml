# AKS-specific patches for Azure Key Vault integration
# Uses Azure AD Workload Identity for secure secret access
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: dapr-demo
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dapr-demo-sa
      containers:
        - name: publisher
          env:
            - name: AZURE_KEYVAULT_NAME
              value: "${AZURE_KEYVAULT_NAME}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
  namespace: dapr-demo
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dapr-demo-sa
      containers:
        - name: subscriber
          env:
            - name: AZURE_KEYVAULT_NAME
              value: "${AZURE_KEYVAULT_NAME}"
