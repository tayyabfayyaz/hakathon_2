# GKE-specific patches for GCP Secret Manager integration
# Uses GKE Workload Identity for secure secret access
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publisher
  namespace: dapr-demo
spec:
  template:
    spec:
      serviceAccountName: dapr-demo-sa
      containers:
        - name: publisher
          env:
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
  namespace: dapr-demo
spec:
  template:
    spec:
      serviceAccountName: dapr-demo-sa
      containers:
        - name: subscriber
          env:
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
