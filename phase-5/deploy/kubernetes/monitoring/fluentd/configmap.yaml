apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: monitoring
data:
  fluent.conf: |
    # Collect container logs
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%NZ
        keep_time_key true
      </parse>
    </source>

    # Add Kubernetes metadata
    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
    </filter>

    # Filter for dapr-demo namespace
    <filter kubernetes.var.log.containers.**dapr-demo**.log>
      @type record_transformer
      <record>
        namespace dapr-demo
        dapr_app ${record.dig("kubernetes", "labels", "app") || "unknown"}
      </record>
    </filter>

    # Filter for dapr-system namespace
    <filter kubernetes.var.log.containers.**dapr-system**.log>
      @type record_transformer
      <record>
        namespace dapr-system
        component ${record.dig("kubernetes", "labels", "app") || "unknown"}
      </record>
    </filter>

    # Output to stdout (for development/debugging)
    <match kubernetes.var.log.containers.**dapr-demo**.log>
      @type stdout
      <format>
        @type json
      </format>
    </match>

    <match kubernetes.var.log.containers.**dapr-system**.log>
      @type stdout
      <format>
        @type json
      </format>
    </match>

    # Drop everything else
    <match **>
      @type null
    </match>
