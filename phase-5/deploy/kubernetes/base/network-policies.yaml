# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dapr-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow Dapr sidecar communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dapr-sidecar
  namespace: dapr-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dapr-demo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Dapr sidecar HTTP API (3500) and gRPC (50001)
    - ports:
        - port: 3500
          protocol: TCP
        - port: 50001
          protocol: TCP
        - port: 9090
          protocol: TCP
    # Allow application port
    - ports:
        - port: 5000
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Dapr control plane
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dapr-system
    # Allow communication within namespace
    - to:
        - podSelector: {}
    # Allow external services (Kafka, Cosmos DB, etc.)
    - ports:
        - port: 443
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 6379
          protocol: TCP
---
# Allow Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: dapr-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dapr-demo
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
