apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-demo-sa
  namespace: dapr-demo
  labels:
    app.kubernetes.io/part-of: dapr-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dapr-demo-role
  namespace: dapr-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["dapr.io"]
    resources: ["components", "configurations", "subscriptions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dapr-demo-rolebinding
  namespace: dapr-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dapr-demo-role
subjects:
  - kind: ServiceAccount
    name: dapr-demo-sa
    namespace: dapr-demo
