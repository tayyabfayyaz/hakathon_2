apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
  namespace: dapr-demo
  labels:
    app: subscriber
    app.kubernetes.io/name: subscriber
    app.kubernetes.io/part-of: dapr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriber
  template:
    metadata:
      labels:
        app: subscriber
        app.kubernetes.io/name: subscriber
        app.kubernetes.io/part-of: dapr-demo
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "subscriber-service"
        dapr.io/app-port: "5000"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
        dapr.io/log-level: "info"
        dapr.io/config: "dapr-config"
    spec:
      serviceAccountName: dapr-demo-sa
      containers:
        - name: subscriber
          image: subscriber-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          env:
            - name: APP_PORT
              value: "5000"
            - name: PUBSUB_NAME
              value: "pubsub"
            - name: STATESTORE_NAME
              value: "statestore"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
