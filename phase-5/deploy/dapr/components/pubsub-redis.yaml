apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: dapr-demo
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis.dapr-demo.svc.cluster.local:6379"
    - name: redisPassword
      value: ""
    - name: consumerID
      value: "dapr-demo"
    - name: enableTLS
      value: "false"
