apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
  namespace: dapr-demo
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    - name: vaultName
      value: "${AZURE_KEYVAULT_NAME}"
    - name: azureClientId
      value: ""  # Uses workload identity (managed identity)
    - name: azureTenantId
      value: "${AZURE_TENANT_ID}"
