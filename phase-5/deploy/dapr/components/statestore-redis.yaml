apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: dapr-demo
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis.dapr-demo.svc.cluster.local:6379"
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "false"
    - name: enableTLS
      value: "false"
