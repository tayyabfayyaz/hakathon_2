apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: dapr-demo
spec:
  type: state.azure.cosmosdb
  version: v1
  metadata:
    - name: url
      secretKeyRef:
        name: cosmosdb-secrets
        key: url
    - name: masterKey
      secretKeyRef:
        name: cosmosdb-secrets
        key: masterKey
    - name: database
      value: "dapr-state"
    - name: collection
      value: "state"
    - name: actorStateStore
      value: "false"
  auth:
    secretStore: secretstore
