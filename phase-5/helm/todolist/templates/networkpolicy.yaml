{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todolist.fullname" . }}-frontend
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todolist.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow inbound traffic from backend pods
  - from:
    - podSelector:
        matchLabels:
          {{- include "todolist.backend.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }}
  # Allow inbound traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }}
  # Allow inbound traffic from same namespace (for health checks, etc.)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }}
  egress:
  # Allow outbound to backend service
  - to:
    - podSelector:
        matchLabels:
          {{- include "todolist.backend.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "todolist.fullname" . }}-backend
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todolist.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow inbound traffic from frontend pods
  - from:
    - podSelector:
        matchLabels:
          {{- include "todolist.frontend.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
  # Allow inbound traffic from same namespace (for health checks, etc.)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - protocol: TCP
      port: {{ .Values.backend.port }}
  egress:
  # Allow outbound to external services (database, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 443   # HTTPS for external APIs
    - protocol: TCP
      port: 80    # HTTP for external APIs
{{- end }}