apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todolist.secretName" . }}
  labels:
    {{- include "todolist.labels" . | nindent 4 }}
type: Opaque
data:
  # Database connection string (base64 encoded)
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}

  # Better Auth secret key (base64 encoded)
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | b64enc | quote }}

  {{- if .Values.secrets.geminiApiKey }}
  # Gemini API key (optional, base64 encoded)
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  {{- end }}
