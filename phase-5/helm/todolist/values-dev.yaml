# Development environment values for TodoList Pro Helm chart
# Overrides for development-specific configuration

# -- Global settings
global:
  # -- Image pull policy for dev environment (Always for easier updates)
  imagePullPolicy: Always

# -- Frontend configuration overrides for development
frontend:
  # -- Number of frontend replicas for development
  replicas: 1
  # -- Resource limits for development (lower than prod)
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  # -- Development-specific health checks
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# -- Backend configuration overrides for development
backend:
  # -- Number of backend replicas for development
  replicas: 1
  # -- Resource limits for development (lower than prod)
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  # -- Development-specific health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # -- HPA (Horizontal Pod Autoscaler) configuration for development
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80

# -- Application configuration overrides for development
config:
  # -- Debug mode (true for development)
  debug: "true"
  # -- CORS allowed origins for development
  corsOrigins: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000"

# -- Secrets configuration for development
# NOTE: These should be overridden in a secure manner for production
secrets:
  # -- PostgreSQL database URL for development
  # Override with actual dev DB connection
  databaseUrl: "postgresql+asyncpg://dev-user:dev-password@dev-host/dev-db?ssl=require"

  # -- Better Auth secret for development
  # Use a simple secret for dev, rotate for production
  betterAuthSecret: "dev-better-auth-secret-change-in-production"

  # -- Gemini API key (optional)
  geminiApiKey: ""

# -- Ingress configuration for development
ingress:
  # -- Enable/disable ingress for development
  enabled: false
  # -- Ingress hosts for development
  hosts:
    - host: todolist-dev.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend