# JSON Schema for Helm Values - TodoList Pro
# This schema validates values.yaml and values-local.yaml
# Reference: https://helm.sh/docs/topics/charts/#schema-files

$schema: https://json-schema.org/draft-07/schema#
title: TodoList Pro Helm Values
description: Configuration schema for TodoList Pro Kubernetes deployment
type: object

properties:
  global:
    type: object
    description: Global settings shared across all subcharts
    properties:
      environment:
        type: string
        enum: [local, development, staging, production]
        default: local
        description: Deployment environment
      imagePullPolicy:
        type: string
        enum: [Always, IfNotPresent, Never]
        default: Never
        description: Image pull policy (Never for minikube docker-env)
      nameOverride:
        type: string
        description: Override chart name

  frontend:
    type: object
    description: Frontend (Next.js) deployment configuration
    properties:
      enabled:
        type: boolean
        default: true
      replicaCount:
        type: integer
        minimum: 1
        maximum: 10
        default: 1
      image:
        type: object
        properties:
          repository:
            type: string
            default: todolist-frontend
          tag:
            type: string
            default: local
          pullPolicy:
            type: string
            enum: [Always, IfNotPresent, Never]
        required: [repository, tag]
      service:
        type: object
        properties:
          type:
            type: string
            enum: [ClusterIP, NodePort, LoadBalancer]
            default: NodePort
          port:
            type: integer
            default: 3000
          nodePort:
            type: integer
            minimum: 30000
            maximum: 32767
            description: Optional fixed NodePort (auto-assigned if omitted)
      resources:
        type: object
        properties:
          limits:
            type: object
            properties:
              cpu:
                type: string
                pattern: "^[0-9]+m?$"
                default: "500m"
              memory:
                type: string
                pattern: "^[0-9]+(Mi|Gi)$"
                default: "512Mi"
          requests:
            type: object
            properties:
              cpu:
                type: string
                default: "100m"
              memory:
                type: string
                default: "256Mi"
      probes:
        type: object
        properties:
          liveness:
            type: object
            properties:
              path:
                type: string
                default: "/"
              initialDelaySeconds:
                type: integer
                default: 30
              periodSeconds:
                type: integer
                default: 15
          readiness:
            type: object
            properties:
              path:
                type: string
                default: "/"
              initialDelaySeconds:
                type: integer
                default: 20
              periodSeconds:
                type: integer
                default: 10
      config:
        type: object
        description: Non-sensitive environment configuration
        properties:
          nextPublicApiUrl:
            type: string
            format: uri
            default: "http://todolist-pro-backend:8000"
            description: Backend API URL (internal K8s DNS)
          betterAuthUrl:
            type: string
            format: uri
            description: Auth callback URL
    required: [enabled, image]

  backend:
    type: object
    description: Backend (FastAPI) deployment configuration
    properties:
      enabled:
        type: boolean
        default: true
      replicaCount:
        type: integer
        minimum: 1
        maximum: 10
        default: 1
      image:
        type: object
        properties:
          repository:
            type: string
            default: todolist-backend
          tag:
            type: string
            default: local
          pullPolicy:
            type: string
            enum: [Always, IfNotPresent, Never]
        required: [repository, tag]
      service:
        type: object
        properties:
          type:
            type: string
            enum: [ClusterIP, NodePort]
            default: ClusterIP
          port:
            type: integer
            default: 8000
      resources:
        type: object
        properties:
          limits:
            type: object
            properties:
              cpu:
                type: string
                default: "500m"
              memory:
                type: string
                default: "512Mi"
          requests:
            type: object
            properties:
              cpu:
                type: string
                default: "100m"
              memory:
                type: string
                default: "256Mi"
      probes:
        type: object
        properties:
          liveness:
            type: object
            properties:
              path:
                type: string
                default: "/health"
              initialDelaySeconds:
                type: integer
                default: 10
              periodSeconds:
                type: integer
                default: 15
          readiness:
            type: object
            properties:
              path:
                type: string
                default: "/health"
              initialDelaySeconds:
                type: integer
                default: 5
              periodSeconds:
                type: integer
                default: 10
      config:
        type: object
        description: Non-sensitive environment configuration
        properties:
          apiVersion:
            type: string
            default: "v1"
          debug:
            type: string
            enum: ["true", "false"]
            default: "false"
          port:
            type: string
            default: "8000"
    required: [enabled, image]

  secrets:
    type: object
    description: Sensitive configuration (pass via --set, not in files)
    properties:
      databaseUrl:
        type: string
        description: PostgreSQL connection string (Neon)
        pattern: "^postgresql://.*$"
      geminiApiKey:
        type: string
        description: Google Gemini API key
        minLength: 1
      betterAuthSecret:
        type: string
        description: JWT signing secret
        minLength: 32
      corsOrigins:
        type: string
        description: Comma-separated list of allowed CORS origins
        default: "http://localhost:3000"
    required: [databaseUrl, betterAuthSecret]

required:
  - frontend
  - backend

# Example valid values:
#
# global:
#   environment: local
#   imagePullPolicy: Never
#
# frontend:
#   enabled: true
#   replicaCount: 1
#   image:
#     repository: todolist-frontend
#     tag: local
#   service:
#     type: NodePort
#     port: 3000
#
# backend:
#   enabled: true
#   replicaCount: 1
#   image:
#     repository: todolist-backend
#     tag: local
#   service:
#     type: ClusterIP
#     port: 8000
#
# secrets:
#   databaseUrl: "postgresql://user:pass@host/db"
#   betterAuthSecret: "your-32-char-minimum-secret-here"
#   geminiApiKey: "your-api-key"
#   corsOrigins: "http://localhost:3000"
