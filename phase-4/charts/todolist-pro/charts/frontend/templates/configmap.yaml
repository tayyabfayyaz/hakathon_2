apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  NEXT_PUBLIC_API_URL: {{ .Values.config.nextPublicApiUrl | quote }}
  BETTER_AUTH_URL: {{ .Values.config.betterAuthUrl | quote }}
  # Allow any localhost/127.0.0.1 ports for K8s/minikube deployments
  TRUSTED_ORIGINS: {{ .Values.config.trustedOrigins | default "" | quote }}
