apiVersion: v2
name: todolist-pro
description: TodoList Pro Kubernetes deployment - Next.js frontend + FastAPI backend
type: application
version: 1.0.0
appVersion: "1.0.0"
maintainers:
  - name: TodoList Pro Team
dependencies:
  - name: frontend
    version: "1.0.0"
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: backend
    version: "1.0.0"
    repository: "file://charts/backend"
    condition: backend.enabled
