# Local Minikube-specific values for TodoList Pro
# Use this file with: helm install todolist-pro ./charts/todolist-pro -f values-local.yaml

# -- Global configuration for local development
global:
  environment: local
  imagePullPolicy: Never  # Required for minikube docker-env

# -- Frontend configuration for local development
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: todolist-frontend
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  config:
    # Internal K8s DNS name for backend service
    nextPublicApiUrl: "http://todolist-pro-backend:8000"
    # This will be replaced with the actual minikube service URL
    betterAuthUrl: "http://localhost:3000"

# -- Backend configuration for local development
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: todolist-backend
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  config:
    apiVersion: "v1"
    debug: "true"  # Enable debug mode for local development
    port: "8000"

# -- Secrets must be provided via --set flags
# Example:
#   helm install todolist-pro ./charts/todolist-pro \
#     -f values-local.yaml \
#     --set secrets.databaseUrl="postgresql+asyncpg://user:pass@host.neon.tech/db?ssl=require" \
#     --set secrets.frontendDatabaseUrl="postgresql://user:pass@host.neon.tech/db?sslmode=require" \
#     --set secrets.betterAuthSecret="your-32-char-minimum-secret" \
#     --set secrets.geminiApiKey="your-gemini-api-key"
secrets:
  corsOrigins: "http://localhost:3000"
